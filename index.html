<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>josecordoba.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #0c0c0e;
      --surface:  #131316;
      --border:   #1f1f24;
      --text:     #e8e8ea;
      --muted:    #52525e;
      --dot:      #1e1e24;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(8,8,10,0.9) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 96px 32px 120px;
    }

    header { margin-bottom: 96px; }

    .eyebrow {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .eyebrow::before {
      content: '';
      display: inline-block;
      width: 20px;
      height: 1px;
      background: var(--muted);
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(36px, 8vw, 64px);
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    h1 em {
      font-style: normal;
      color: transparent;
      -webkit-text-stroke: 1px var(--muted);
    }

    section { margin-bottom: 72px; }

    .label {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .hof-list {
      border-top: 1px solid var(--border);
    }

    .hof-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      cursor: default;
      transition: padding-left 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .hof-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0;
      background: var(--surface);
      z-index: -1;
      transition: width 0.3s ease;
    }

    .hof-item:hover::before { width: 100%; }
    .hof-item:hover { padding-left: 16px; }
    .hof-item:hover .hof-index { color: var(--text); }

    .hof-name {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: -0.01em;
    }

    .hof-index {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      transition: color 0.25s;
    }

    .accounts-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .account-row {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      transition: border-color 0.2s, background 0.2s;
    }

    .account-row.static { cursor: default; }

    .account-row:not(.static):hover {
      border-color: #2a2a32;
      background: #161619;
    }

    .account-row:not(.static):hover .account-arrow {
      transform: translateX(4px);
      opacity: 1;
    }

    .account-platform {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
      width: 90px;
      flex-shrink: 0;
    }

    .account-sep {
      width: 1px;
      height: 16px;
      background: var(--border);
      margin: 0 20px;
      flex-shrink: 0;
    }

    .account-handle {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: -0.01em;
      flex: 1;
    }

    .account-arrow {
      font-size: 14px;
      color: var(--muted);
      opacity: 0.4;
      transition: transform 0.2s, opacity 0.2s;
      margin-left: auto;
    }

    .notice {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .notice-dash { color: var(--muted); font-size: 12px; padding-top: 1px; flex-shrink: 0; }
    .notice-text { font-size: 12px; color: var(--muted); line-height: 1.6; }

    footer {
      margin-top: 96px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .footer-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3ddc84;
      box-shadow: 0 0 6px #3ddc84;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .reveal {
      opacity: 0;
      transform: translateY(24px);
      animation: revealUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes revealUp {
      to { opacity: 1; transform: translateY(0); }
    }

    header                  { animation-delay: 0.05s; }
    section:nth-of-type(1)  { animation-delay: 0.2s; }
    section:nth-of-type(2)  { animation-delay: 0.32s; }
    footer                  { animation-delay: 0.44s; }

    @media (max-width: 480px) {
      .page { padding: 64px 24px 80px; }
      h1 { font-size: 36px; }
      .account-platform { width: 70px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="reveal">
      <p class="eyebrow">josecordoba.com</p>
      <h1>yes, that should <em>work.</em></h1>
    </header>

    <section class="reveal">
      <p class="label">Hall of Fame</p>
      <div class="hof-list">
        <div class="hof-item">
          <span class="hof-name">Hotline Miami</span>
          <span class="hof-index">01</span>
        </div>
        <div class="hof-item">
          <span class="hof-name">Enter the Gungeon</span>
          <span class="hof-index">02</span>
        </div>
        <div class="hof-item">
          <span class="hof-name">Katana Zero</span>
          <span class="hof-index">03</span>
        </div>
        <div class="hof-item">
          <span class="hof-name">The Messenger</span>
          <span class="hof-index">04</span>
        </div>
      </div>
    </section>

    <section class="reveal">
      <p class="label">Accounts</p>
      <div class="accounts-list">
        <a class="account-row" href="https://bsky.app/profile/jacr.bsky.social" target="_blank" rel="noopener">
          <span class="account-platform">Bluesky</span>
          <span class="account-sep"></span>
          <span class="account-handle">@jacr</span>
          <span class="account-arrow">→</span>
        </a>
        <div class="account-row static">
          <span class="account-platform">Discord</span>
          <span class="account-sep"></span>
          <span class="account-handle">@jacordobar</span>
        </div>
      </div>
      <div class="notice">
        <span class="notice-dash">—</span>
        <span class="notice-text">Accounts not listed here are not owned by me.</span>
      </div>
    </section>

    <footer class="reveal">
      <span class="footer-name">Jose Cordoba</span>
      <div class="footer-status">
        <span class="status-dot"></span>
        Online
      </div>
    </footer>

  </div>
</body>
</html>
