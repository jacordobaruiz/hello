<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>42</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #000000; /* true black, OLED-friendly */
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    main {
      width: 100%;
      max-width: 700px;
    }

    p {
      line-height: 1.5;
      margin-bottom: 2rem;
      font-size: 0.98rem;
      color: #e0e0e0;
    }

    h2 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.75rem;
      color: #b3b3b3;
    }

    ul {
      list-style: none;
    }

    li + li {
      margin-top: 0.4rem;
    }

    a {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid #444;
      padding-bottom: 2px;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    a:hover,
    a:focus-visible {
      color: #fafafa;
      border-color: #ffffff;
    }
  </style>
</head>
<body>
  <main>
    <p>
      Too cheap to pay for Linktree, too irrelevant to opt for the legendary
      blue check, so here's my official stuff, as if anyone would care.
    </p>

    <section>
      <h2>My Stuff</h2>
      <ul>
        <li>
          <a
            href="https://bsky.app/profile/jacr.bsky.social"
            target="_blank"
            rel="noopener noreferrer"
          >
            Bluesky
          </a>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
