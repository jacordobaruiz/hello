<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>?</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

    <style>
        /* --- VARIABLES & RESET --- */
        :root {
            --bg: #000000;
            --fg: #FFFFFF;
            --grid-line: 1px solid #333; /* Líneas sutiles para la grilla de pokes */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: crosshair; 
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'DotGothic16', monospace;
            font-size: 18px;
            overflow: hidden; /* Sin scroll en la home principal */
            text-transform: uppercase;
            -webkit-font-smoothing: none;
            height: 100vh;
            width: 100vw;
        }

        a { text-decoration: none; color: inherit; cursor: pointer; }
        button { background: none; border: none; color: inherit; font-family: inherit; font-size: inherit; cursor: pointer; text-transform: uppercase; }

        /* --- NAVEGACIÓN FIJA (Esquinas) --- */
        .nav-fixed {
            position: fixed;
            z-index: 300; /* Por encima de todo */
            padding: 0;
        }

        .top-left { top: 0; left: 0; }
        .top-right { top: 0; right: 0; text-align: right; }
        .bottom-left { bottom: 0; left: 0; }
        .bottom-right { bottom: 0; right: 0; }

        .blink { animation: blinker 1.5s step-end infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        /* --- CONTENIDO PRINCIPAL (Home) --- */
        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            width: 100%;
            transition: opacity 0.5s;
        }

        .project-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 100%;
            padding: 1.5vh 0;
            border-bottom: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .project-name { font-size: 4vw; line-height: 1; }
        .project-cat { font-size: 1rem; text-align: right; }

        .project-row:hover {
            background-color: var(--fg);
            color: var(--bg);
            padding-left: 10px;
            padding-right: 10px;
        }

        /* --- OVERLAY DE POKEMON (Oculto por defecto) --- */
        #shiny-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            z-index: 200; /* Entre el main y el nav */
            display: flex;
            flex-direction: column;
            transform: translateY(-100%); /* Escondido arriba */
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            overflow-y: auto; /* Permite scroll si hay muchos pokes */
        }

        #shiny-overlay.active {
            transform: translateY(0); /* Baja al activarse */
        }

        /* Estilo de la Grilla Pokemon */
        .poke-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            width: 100%;
            border-top: var(--grid-line);
            margin-top: 60px; /* Espacio para el botón de cerrar */
        }

        .poke-item {
            aspect-ratio: 1/1;
            border-right: var(--grid-line);
            border-bottom: var(--grid-line);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-direction: column;
        }

        .poke-item img {
            width: 60%;
            height: 60%;
            object-fit: contain;
            filter: grayscale(100%) contrast(1.2); /* B/N por defecto */
            transition: filter 0.3s;
            image-rendering: pixelated; /* Mantiene el pixel art nítido */
        }

        .poke-item:hover img {
            filter: grayscale(0%) drop-shadow(0 0 5px rgba(255,255,255,0.5)); /* Color al hover */
        }

        .poke-name {
            position: absolute;
            bottom: 5px;
            left: 5px;
            font-size: 0.7rem;
            opacity: 0.5;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .project-row { flex-direction: column; padding: 20px 0; }
            .project-name { font-size: 3rem; }
            .nav-fixed, .project-row { padding-left: 5px; padding-right: 5px; }
            .poke-grid { grid-template-columns: repeat(3, 1fr); } /* 3 columnas en móvil */
        }
    </style>
</head>
<body>

    <!-- NAV FIJO -->
    <div class="nav-fixed top-left">?<span class="blink">_</span></div>
    
    <div class="nav-fixed top-right">
        <!-- Botón que activa el Overlay -->
        <button onclick="toggleShinies()" id="menu-btn">[ SHINIES + ]</button>
    </div>

    <div class="nav-fixed bottom-left">INDEX</div>
    <div class="nav-fixed bottom-right">©2025</div>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="main-content">
        <a href="https://bsky.app/profile/jacr.bsky.social" target="_blank" class="project-row">
            <span class="project-name">BLUESKY</span>
            <span class="project-cat">SOCIAL / PROFILE</span>
        </a>
    </main>

    <!-- OVERLAY DE POKEMON -->
    <div id="shiny-overlay">
        <div class="poke-grid">
            
            <!-- POKE 1 -->
            <div class="poke-item">
                <span class="poke-name">006</span>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/6.png" alt="Charizard">
            </div>

            <!-- POKE 2 -->
            <div class="poke-item">
                <span class="poke-name">025</span>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/25.png" alt="Pikachu">
            </div>

            <!-- POKE 3 -->
            <div class="poke-item">
                <span class="poke-name">094</span>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/94.png" alt="Gengar">
            </div>

            <!-- POKE 4 -->
            <div class="poke-item">
                <span class="poke-name">130</span>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/130.png" alt="Gyarados">
            </div>

            <!-- POKE 5 -->
            <div class="poke-item">
                <span class="poke-name">150</span>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/150.png" alt="Mewtwo">
            </div>

            <!-- POKE 6 -->
            <div class="poke-item">
                <span class="poke-name">249</span>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/249.png" alt="Lugia">
            </div>

            <!-- POKE 7 (Relleno para demo) -->
            <div class="poke-item">
                <span class="poke-name">384</span>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/384.png" alt="Rayquaza">
            </div>
             <!-- POKE 8 (Relleno para demo) -->
             <div class="poke-item">
                <span class="poke-name">448</span>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/448.png" alt="Lucario">
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT PARA ABRIR/CERRAR -->
    <script>
        function toggleShinies() {
            const overlay = document.getElementById('shiny-overlay');
            const btn = document.getElementById('menu-btn');
            
            // Si la clase 'active' está presente, la quitamos (Cerrar)
            if (overlay.classList.contains('active')) {
                overlay.classList.remove('active');
                btn.innerText = "[ SHINIES + ]";
            } else {
                // Si no está, la ponemos (Abrir)
                overlay.classList.add('active');
                btn.innerText = "[ X CERRAR ]";
            }
        }
    </script>

</body>
</html>
