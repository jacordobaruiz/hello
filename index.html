<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>you shouldn't be here</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 8vw;
      margin-bottom: 1rem;
    }

    p {
      font-size: 4.5vw;
      text-align: center;
    }

    @media (min-width: 768px) {
      h1 {
        font-size: 3rem;
      }

      p {
        font-size: 1.5rem;
      }
    }

    a {
      color: #ccc;
      text-decoration: none;
    }

    a:hover {
      color: #fff;
    }

    .sprite-container {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      height: 96px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .sprite-container img {
      image-rendering: pixelated;
      width: 64px;
      height: 64px;
      opacity: 0.85;
      animation: flicker 1.5s infinite;
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.85; }
      45% { opacity: 0.4; }
      50% { opacity: 1; }
      55% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <main>
    <h1>welcome</h1>
    <p>found a shiny and got pokerus in Pokemon Emerald, full odds, same session full odds (1/179000000). 100% kanto/johto/hoenn dex, 7/7, shiny count: 9.</p>
  </main>

  <div class="sprite-container">
    <img id="sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/197.png" alt="Umbreon">
  </div>

  <script>
    const shinySprites = [
      {
        name: "Umbreon",
        url: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/197.png"
      },
      {
        name: "Espeon",
        url: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/196.png"
      },
      {
        name: "Sceptile",
        url: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/254.png"
      },
      {
        name: "Typhlosion",
        url: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/157.png"
      },
      {
        name: "Spinda",
        url: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/327.png"
      },
      {
        name: "Manectric",
        url: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/310.png"
      },
      {
        name: "Charizard",
        url: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/6.png"
      }
    ];

    let index = 0;
    const sprite = document.getElementById("sprite");

    setInterval(() => {
      index = (index + 1) % shinySprites.length;
      sprite.src = shinySprites[index].url;
      sprite.alt = shinySprites[index].name;
    }, 2000);
  </script>
</body>
</html>
