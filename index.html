<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown</title>

  <style>
    :root{
      --bg:#fff;   /* fondo blanco */
      --fg:#000;   /* texto negro para contraste */
    }

    html, body{
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .wrap{
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5vh 2.5vw;
      box-sizing: border-box;
    }

    .countdown-shell{
      width: min(1400px, 100%);
      text-align: center;
      color: var(--fg);
    }

    .tickcounter{
      color: var(--fg) !important;
      filter: none;
      width: 100% !important;
      left: 0 !important;
      margin: 0 auto !important;
      position: relative !important;
      display: block !important;
      height: 0 !important;
      padding-bottom: 55vh !important;
    }

    @media (max-width: 768px){
      .wrap{ padding: 2vh 3vw; }
      .tickcounter{ padding-bottom: 68vh !important; }
    }

    @media (min-width: 1200px){
      .tickcounter{ padding-bottom: 60vh !important; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="countdown-shell" aria-label="Countdown">
      <script>
        (function(d, s, id) {
          var js, pjs = d.getElementsByTagName(s)[0];
          if (d.getElementById(id)) return;
          js = d.createElement(s);
          js.id = id;
          js.src = "//www.tickcounter.com/static/js/loader.js";
          pjs.parentNode.insertBefore(js, pjs);
        }(document, "script", "tickcounter-sdk"));
      </script>

      <a
        data-type="countdown"
        data-id="9138649"
        class="tickcounter"
        title="THE END OF EVANGELION."
        href="//www.tickcounter.com/"
      >
        THE END OF EVANGELION.
      </a>
    </section>
  </main>
</body>
</html>
