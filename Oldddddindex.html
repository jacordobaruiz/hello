<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THE END OF EVANGELION</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body{
      background:#000;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }

    .wrap{
      width: min(1200px, 92vw);
      text-align: center;
      line-height: 1.05;
      user-select: none;
    }

    /* Tipografía que “ocupa” la pantalla */
    h1{
      margin: 0 0 2.5vh 0;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: clamp(20px, 5vw, 64px);
      opacity: 0.95;
    }

    #timer, #done{
      font-weight: 900;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      text-transform: uppercase;
      /* Muy grande y adaptable */
      font-size: clamp(48px, 10vw, 160px);
      margin: 0;
      padding: 0;
      white-space: nowrap;
    }

    /* En pantallas muy estrechas, permitir salto */
    @media (max-width: 420px){
      #timer, #done { white-space: normal; }
    }

    .sub{
      margin-top: 2.5vh;
      opacity: 0.7;
      font-size: clamp(12px, 2.3vw, 18px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <main class="wrap" aria-live="polite">
    <h1>THE END OF EVANGELION</h1>

    <p id="timer">--:--:--</p>
    <p id="done" style="display:none;">I CAN (NOT) BE REPLACED.</p>

    <div class="sub" id="targetInfo"></div>
  </main>

  <script>
    // Objetivo: 12 de enero de 2026, 07:00:00 (hora local del dispositivo)
    const target = new Date(2026, 0, 12, 7, 0, 0, 0); // (año, mes-0based, día, hora, min, seg, ms)

    const timerEl = document.getElementById("timer");
    const doneEl  = document.getElementById("done");
    const infoEl  = document.getElementById("targetInfo");

    function pad2(n){ return String(n).padStart(2, "0"); }

    function tick(){
      const now = new Date();
      let diffMs = target - now;

      if (diffMs <= 0){
        timerEl.style.display = "none";
        doneEl.style.display = "block";
        infoEl.textContent = ""; // opcional: limpiar
        return;
      }

      const totalSeconds = Math.floor(diffMs / 1000);

      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      // Horas pueden ser > 99, así que no las limitamos a 2 dígitos
      timerEl.textContent = `${hours}:${pad2(minutes)}:${pad2(seconds)}`;

      // Info opcional
      infoEl.textContent = `Objetivo: ${target.toLocaleString()}`;

      // Sincroniza el “tick” para que cambie cercano al siguiente segundo real
      const drift = diffMs % 1000;
      setTimeout(tick, Math.max(50, drift));
    }

    tick();
  </script>
</body>
</html>
